[build-system]
requires = ["setuptools>=78"]
build-backend = "setuptools.build_meta"

[project]
name = "dhaka-aqi"
version = "1.0.0"
description = "Auditable extraction of official Bangladesh DoE Dhaka AQI reports"
requires-python = ">=3.11"
dependencies = [
  "openpyxl==3.1.5",
  "pandas==2.3.3",
  "pdfplumber==0.11.7",
]

[project.optional-dependencies]
analysis = [
  "matplotlib==3.10.9",
  "scipy==1.16.3",
  "statsmodels==0.14.5",
]
dev = [
  "pytest==8.4.2",
  "ruff==0.14.3",
]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
