[build-system]
requires = ["setuptools>=78"]
build-backend = "setuptools.build_meta"

[project]
name = "dhaka-aqi"
version = "0.2.0"
description = "Auditable PM2.5 analysis for one identified Dhaka monitor"
requires-python = ">=3.11"
dependencies = [
  "matplotlib==3.10.9",
  "numpy==2.3.5",
  "pandas==2.3.3",
  "pyarrow==25.0.0",
  "PyYAML==6.0.3",
  "scipy==1.16.3",
  "statsmodels==0.14.5",
]

[project.optional-dependencies]
dev = [
  "pytest==8.4.2",
  "ruff==0.14.3",
]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
